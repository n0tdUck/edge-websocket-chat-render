# Render Blueprint: deploys server/ as a free web service with HTTPS/WSS.
# Render dashboard -> New -> Blueprint -> pick the GitHub repo that contains this file.
services:
  - type: web
    name: websocket-chat
    runtime: node
    plan: free
    # Closest region to your users: oregon, ohio, virginia, frankfurt, singapore.
    # It can't be changed after the service is created.
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Random access key generated by Render. Find it under the service's Environment tab.
      - key: CHAT_TOKEN
        generateValue: true
