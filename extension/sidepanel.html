<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Join screen -->
  <main id="join-view" class="join">
    <div class="join-brand">
      <img src="icons/icon48.png" alt="" width="40" height="40">
      <h1>WebSocket Chat</h1>
      <p>Join a room to start chatting.</p>
    </div>

    <form id="join-form" class="join-form" novalidate>
      <label>
        <span>Server URL</span>
        <input id="server-url" type="text" placeholder="ws://localhost:8080" spellcheck="false" autocomplete="off" required>
      </label>
      <label>
        <span>Nickname</span>
        <input id="name" type="text" maxlength="32" placeholder="Your name" autocomplete="off" required>
      </label>
      <label>
        <span>Room</span>
        <input id="room" type="text" maxlength="32" placeholder="lobby" spellcheck="false" autocomplete="off">
      </label>
      <label>
        <span>Access key <em>(optional)</em></span>
        <input id="token" type="password" placeholder="Only if the server requires one" autocomplete="off">
      </label>

      <p id="join-error" class="join-error" role="alert" hidden></p>
      <p id="join-status" class="join-status" role="status" hidden></p>

      <button id="join-btn" type="submit" class="btn-primary">Join room</button>
      <button id="cancel-btn" type="button" class="btn-secondary" hidden>Cancel</button>
    </form>
  </main>

  <!-- Chat screen -->
  <main id="chat-view" class="chat" hidden>
    <header class="chat-header">
      <div class="room-info">
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
        <div class="room-text">
          <strong id="room-name">#lobby</strong>
          <span id="status-text">Connecting…</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="users-btn" class="icon-btn" type="button" title="People in this room" aria-expanded="false" aria-controls="users-panel">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7.5 9.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1.5c-3 0-5.5 1.6-5.5 3.6V16h11v-1.4c0-2-2.5-3.6-5.5-3.6Zm6-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm.6 1.6c1.1.6 1.9 1.6 1.9 2.9V16h2v-1.6c0-1.6-1.6-2.9-3.9-3.3Z"/></svg>
          <span id="user-count">0</span>
        </button>
        <button id="leave-btn" class="icon-btn" type="button" title="Leave room">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 3.5a.5.5 0 0 0-.5-.5h-3A1.5 1.5 0 0 0 3 4.5v11A1.5 1.5 0 0 0 4.5 17h3a.5.5 0 0 0 0-1h-3a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5h3a.5.5 0 0 0 .5-.5Zm5.15 2.65a.5.5 0 0 1 .7 0l3.5 3.5a.5.5 0 0 1 0 .7l-3.5 3.5a.5.5 0 0 1-.7-.7l2.64-2.65H7.5a.5.5 0 0 1 0-1h8.29l-2.64-2.65a.5.5 0 0 1 0-.7Z"/></svg>
        </button>
      </div>
    </header>

    <aside id="users-panel" class="users-panel" hidden>
      <h2>In this room</h2>
      <ul id="users-list"></ul>
    </aside>

    <div id="messages" class="messages" role="log" aria-live="polite"></div>

    <div id="typing" class="typing" aria-live="polite"></div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Type a message…" disabled></textarea>
      <button id="send-btn" class="send-btn" type="submit" title="Send (Enter)" disabled>
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2.72 2.05a.5.5 0 0 0-.7.6L4.25 10l-2.23 7.35a.5.5 0 0 0 .7.6l15-7.5a.5.5 0 0 0 0-.9l-15-7.5ZM5.15 10.5 3.4 16.25 16.38 10 3.4 3.75l1.75 5.75H11a.5.5 0 0 1 0 1H5.15Z"/></svg>
      </button>
    </form>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
